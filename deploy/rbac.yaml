apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-operator
  namespace: agent-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-operator
rules:
  # The CRDs it owns, plus their status subresource.
  - apiGroups: ["agents.hhagenbuch.io"]
    resources: ["agents", "promptversions", "agents/status", "promptversions/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Workloads it renders.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only: secrets (mounted into pods, never logged) and Job pod logs (rollback report).
  - apiGroups: [""]
    resources: ["secrets", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-operator
subjects:
  - kind: ServiceAccount
    name: agent-operator
    namespace: agent-operator-system
