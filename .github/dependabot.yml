# Keep dependencies current so the repo reads as actively maintained.
# Dependabot opens PRs; CI (build + tests) gates them like any other change.
#
# Updates are GROUPED: without grouping, every coordinate gets its own PR, which
# means ~10 PRs a week here, each running a full `mvn -B verify`, and every merge
# rebases the rest. Grouped PRs also prove the combination builds, which a pile of
# individually-green PRs never does.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      build-plugins:
        patterns: ["org.apache.maven.plugins:*"]
      test-libs:
        patterns: ["org.junit*", "org.assertj:*", "org.mockito:*"]
      # The whole fabric8 family moves together or not at all. Bumping one
      # artifact (crd-generator-apt) while the client stayed pinned by the
      # operator SDK is what put two fabric8 majors on one classpath.
      kubernetes-client:
        patterns: ["io.fabric8:*", "io.javaoperatorsdk:*"]
    ignore:
      # A fabric8 or JOSDK MAJOR is a coordinated migration by definition — JOSDK
      # pins the kubernetes-client transitively while fabric8.version drives
      # crd-generator-apt, so the two must be moved deliberately, in one PR, with
      # a CRD diff. Dependabot must never be able to propose half of it.
      # Target when we do it: JOSDK 5.5.0 + fabric8 7.x (see README roadmap).
      - dependency-name: "io.fabric8:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.javaoperatorsdk:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    ignore:
      # The build stage (maven:*-eclipse-temurin-N) and the runtime stage
      # (eclipse-temurin:N-jre) must move together and deliberately. A lone major
      # bump builds on JDK N+1 while still running on JDK N, and swaps a pinned
      # maven tag for a floating one.
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]
