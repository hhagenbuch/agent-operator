name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, test, and generate CRDs
        run: mvn -B verify
      - name: Upload generated CRDs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crd
          # Both CRDs — the operator reconciles Agent and PromptVersion.
          path: |
            target/classes/META-INF/fabric8/agents.agents.hhagenbuch.io-v1.yml
            target/classes/META-INF/fabric8/promptversions.agents.hhagenbuch.io-v1.yml
